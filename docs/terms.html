<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이용약관 | 루미에르</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="legal-page"><article class="container legal-card"><a class="back-link" href="../index.html">← 홈으로</a><span class="draft-badge">검토 필요</span><h1>이용약관</h1><p>현재 사이트는 서비스 구축을 위한 데모이며 실제 계약, 주문 또는 결제를 제공하지 않습니다.</p><h2>정식 오픈 전 추가할 내용</h2><ul><li>서비스 제공 범위와 이용 조건</li><li>회원 및 비회원의 권리와 의무</li><li>견적과 최종 계약 금액의 차이</li><li>주문 확정, 제작 변경 및 취소 조건</li><li>지식재산권과 참고 이미지의 이용 범위</li><li>분쟁 해결 및 관할</li></ul><p>전자상거래에 적용되는 법률과 실제 영업 정책을 반영해 별도 검토해야 합니다.</p></article></main></body></html>
