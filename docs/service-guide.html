<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서비스 안내 | 루미에르</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="legal-page"><article class="container legal-card"><a class="back-link" href="../index.html">← 홈으로</a><span class="draft-badge">서비스 준비 중</span><h1>서비스 안내</h1><p>루미에르는 사진과 선택 조건을 바탕으로 주얼리 맞춤 제작의 예상 가격 범위를 안내하는 서비스입니다.</p><h2>이용 절차</h2><ol><li>주얼리 종류와 선호 소재를 선택합니다.</li><li>필요한 경우 참고 이미지를 등록합니다.</li><li>예상 견적 범위를 확인합니다.</li><li>정식 서비스에서는 상담 후 디자인과 최종 제작비를 확정합니다.</li></ol><h2>현재 제공 범위</h2><p>현재 사이트는 서비스 구조를 검증하기 위한 데모입니다. 입력한 정보와 이미지는 서버에 저장되지 않으며 실제 주문이나 결제가 발생하지 않습니다.</p></article></main></body></html>
